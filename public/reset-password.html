<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password - To-Do</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <div class="main-div">
      <div class="login-container">
        <div class="login-header">
          <h1>Set New Password</h1>
          <p class="subtitle">Enter your new password below</p>
        </div>

        <form class="login-form" action="index.html" method="get">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <div class="input-icon-wrapper">
              <i class="bi bi-lock"></i>
              <input
                type="password"
                id="new-password"
                name="newPassword"
                placeholder="Enter your new password"
                required
                autocomplete="new-password"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="input-icon-wrapper">
              <i class="bi bi-lock-fill"></i>
              <input
                type="password"
                id="confirm-password"
                name="confirmPassword"
                placeholder="Confirm your new password"
                required
                autocomplete="new-password"
              />
            </div>
          </div>

          <button type="submit" id="login-button">
            <i class="bi bi-check2-circle"></i>
            Submit
          </button>
        </form>

        <div class="signup-link">
          <p>Remember your password?</p>
          <a href="index.html">Back to Login</a>
        </div>
      </div>
    </div>

    <script>
      const url = "https://to-do-backend-7000.onrender.com";

      const resetForm = document.querySelector(".login-form");

      resetForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = document.getElementById("new-password").value;
        const confirmPassword =
          document.getElementById("confirm-password").value;

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");

        if (!token) {
          alert("Reset token is missing from the URL.");
          return;
        }

        if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return;
        }

        try {
          const response = await fetch(`${url}/reset-password/${token}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              password: password,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Password changed successfully! Redirecting to login...");
            window.location.href = "index.html";
          } else {
            const errorText = await response.text();
            console.error("Server Error:", errorText);
            alert("Failed to reset password. Check console for details.");
            return;
          }
        } catch (err) {
          console.error("Reset Password error:", err);
          alert("Something went wrong. Please try again later.");
        }
      });
    </script>
  </body>
</html>
